[project]
name = "benchspot"
version = "0.1.0"
description = "Reproducible Whisper benchmarks against an existing OpenAI-compatible transcription endpoint"
requires-python = ">=3.12,<3.13"
dependencies = ["aiperf==0.13.0", "soundfile==0.13.1"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 110

[tool.ruff.format]
quote-style = "single"
